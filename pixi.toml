[workspace]
channels = ["conda-forge", "bioconda"]
name = "NetNC"
description = "Network Neighbourhood Clustering tool"
platforms = ["linux-64", "linux-aarch64"]
version = "0.1.0"

[dependencies]
perl = ">=5.32.1,<5.33"
r-base = ">=4.6.0,<4.7"
#GCC-version 13 or below
gcc = "13.*"
# python
python = "3.12.*"
numpy = ">=2.4.6,<3"
networkx = ">=3.6.1,<4"

